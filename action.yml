name: System Synthesis Architecture Review
description: Detect semantic Docker Compose architecture changes and enforce deterministic policy in pull requests.
author: System Synthesis

branding:
  icon: git-pull-request
  color: purple

inputs:
  repository-directory:
    description: Repository checkout directory within GITHUB_WORKSPACE. Useful when the trusted Action and untrusted PR source are checked out separately.
    required: false
    default: .
  compose-path:
    description: Repository-relative Docker Compose file. Omit to detect one standard root filename across the base and head; multiple candidates require an explicit path.
    required: false
  policy-path:
    description: Repository-relative JSON policy. The base-branch version governs the review.
    required: false
    default: .system-synthesis/policy.json
  base-revision:
    description: Base commit SHA or ref. Defaults to the pull_request event base SHA; required for other events.
    required: false
  head-revision:
    description: Head commit SHA or ref. Defaults to the pull_request event head SHA, never the merge SHA; required for other events.
    required: false
  output-directory:
    description: Repository-relative directory for JSON, Markdown, and SARIF reports.
    required: false
    default: .system-synthesis/reports
  ingestion-url:
    description: Full HTTPS System Synthesis GitHub ingestion endpoint. Set alone to authenticate with GitHub OIDC, which needs id-token write permission on the job. Omit with ingestion-token to keep analysis local.
    required: false
  ingestion-token:
    description: Repository-scoped System Synthesis ingestion token, for a repository connected with one. Pass from a GitHub Actions secret only to a trusted, pinned Action implementation. Omit for GitHub OIDC.
    required: false

outputs:
  compose-path:
    description: Resolved repository-relative Compose file used for the comparison.
  base-revision:
    description: Resolved full base commit SHA used for analysis and policy.
  head-revision:
    description: Resolved full head commit SHA used for analysis.
  exit-code:
    description: 0 for pass, 1 for blocking findings, or 2 for invalid input or a configured ingestion failure.
  status:
    description: pass, fail, or error.
  blocking-findings:
    description: Number of newly introduced blocking findings.
  json-file:
    description: Absolute path to the machine-readable JSON report.
  markdown-file:
    description: Absolute path to the pull-request Markdown report.
  comment-file:
    description: >-
      Absolute path to a ready-to-post pull-request comment. Leads with the
      verdict and the review link, carries the marker used to update one comment
      across runs, and embeds the full Markdown report.
  sarif-file:
    description: Absolute path to the SARIF 2.1.0 report.
  ingestion-status:
    description: created, updated, unchanged, stale, skipped, or error.
  review-id:
    description: Persisted browser review identifier when ingestion succeeds.
  review-url:
    description: Persisted browser review URL when ingestion succeeds.

runs:
  using: node24
  main: architecture-action/dist/index.js
