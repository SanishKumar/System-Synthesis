name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build --workspace=frontend
        env:
          # Dummy URL required for Next.js build time, overridden at runtime
          NEXT_PUBLIC_SOCKET_URL: http://localhost:4000

  backend-check:
    runs-on: ubuntu-latest

    # A disposable PostgreSQL, so the synchronization contract runs against real
    # SQL rather than only against memory storage. The two backends implement
    # the same guarantees separately and have already drifted once; each is
    # correct on its own terms, so only running both catches the disagreement.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: system_synthesis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Dependencies
        run: npm ci

      # The production tree is what gets deployed, so a high-severity advisory
      # reaching it fails the build rather than waiting to be noticed. Anything
      # knowingly carried is recorded in docs/KNOWN_LIMITATIONS.md; today that is
      # one low, development-only advisory, which this does not cover.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build architecture packages and backend
        run: npm run build --workspace=architecture-core && npm run build --workspace=architecture-cli && npm run build --workspace=architecture-action && npm run build --workspace=server

      - name: Verify committed Action bundle matches source
        run: git diff --exit-code -- architecture-action/dist

      - name: Run architecture core tests
        run: npm test --workspace=architecture-core && npm test --workspace=architecture-cli && npm test --workspace=architecture-action && npm test --workspace=frontend

      - name: Run backend, security, recovery, and convergence tests
        run: npm test --workspace=server
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/system_synthesis_test?sslmode=disable

      - name: Fail if the PostgreSQL contract did not actually run
        # Skipping is the correct local behaviour and the wrong CI behaviour: a
        # suite that silently skips here would leave the SQL untested while the
        # pipeline stayed green.
        run: npm test --workspace=server -- src/services/__tests__/githubSyncPostgres.test.ts --reporter=json --outputFile=pg-report.json
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/system_synthesis_test?sslmode=disable

      - name: Check the PostgreSQL contract reported passing tests
        run: |
          node -e '
            const report = require("./server/pg-report.json");
            const passed = report.numPassedTests ?? 0;
            const skipped = (report.numPendingTests ?? 0) + (report.numTodoTests ?? 0);
            if (passed === 0 || skipped > 0) {
              console.error(`PostgreSQL contract did not run: ${passed} passed, ${skipped} skipped`);
              process.exit(1);
            }
            console.log(`PostgreSQL contract ran: ${passed} passed`);
          '

      - name: Run authenticated API and WebSocket integration checks
        shell: bash
        run: |
          node server/dist/index.js > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:4000/health > /dev/null; then break; fi
            sleep 1
          done
          curl --fail http://localhost:4000/health
          node test_phases.mjs
