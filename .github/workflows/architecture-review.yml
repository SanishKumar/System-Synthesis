name: Architecture change review

on:
  pull_request:
    branches: ["main"]
    # Deliberately unfiltered. A path filter that fails to match does not report
    # a skipped check — it reports nothing at all, which is indistinguishable
    # from a passing review and hides the gate exactly when it is needed. A
    # filter written as "**/docker-compose*.yml" also never matches a
    # root-level file, because the slash after ** requires a directory.
    # The review is a few seconds, and a wrong compose-path now fails loudly,
    # so running it on every pull request is both cheaper and safer than
    # deciding in advance which changes could affect architecture.

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  architecture-review:
    name: Deterministic architecture policy
    runs-on: ubuntu-latest

    steps:
      # Never pass a repository secret to Action code from the pull-request
      # checkout. The trusted implementation and untrusted source are checked
      # out into separate directories, with the trusted base commit first.
      - name: Checkout trusted Action implementation
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-action
          persist-credentials: false
          sparse-checkout: |
            action.yml
            architecture-action/dist
          sparse-checkout-cone-mode: false

      - name: Checkout pull request with base history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: source
          persist-credentials: false

      - name: Compare base and head architecture
        id: review
        uses: ./trusted-action
        continue-on-error: true
        with:
          repository-directory: source
          compose-path: docker-compose.dev.yml
          policy-path: .system-synthesis/policy.json
          base-revision: ${{ github.event.pull_request.base.sha }}
          head-revision: ${{ github.event.pull_request.head.sha }}
          # Both halves or neither. Asking only whether this is a fork was not
          # enough: a Dependabot pull request runs on a branch in this
          # repository, so that test passed, but such an event can read Actions
          # variables and cannot read secrets. The endpoint arrived without its
          # credential, and the Action refused the pair — correctly, since a URL
          # with no token is a misconfiguration and not a request to skip.
          ingestion-url: ${{ (github.event.pull_request.head.repo.full_name == github.repository && vars.SYSTEM_SYNTHESIS_INGESTION_URL != '' && secrets.SYSTEM_SYNTHESIS_INGESTION_TOKEN != '') && vars.SYSTEM_SYNTHESIS_INGESTION_URL || '' }}
          ingestion-token: ${{ (github.event.pull_request.head.repo.full_name == github.repository && vars.SYSTEM_SYNTHESIS_INGESTION_URL != '' && secrets.SYSTEM_SYNTHESIS_INGESTION_TOKEN != '') && secrets.SYSTEM_SYNTHESIS_INGESTION_TOKEN || '' }}

      - name: Upload source-linked findings to code scanning
        if: >-
          always() &&
          steps.review.outputs.sarif-file != '' &&
          steps.review.outputs.exit-code != '2'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.review.outputs.sarif-file }}
          category: system-synthesis/docker-compose

      - name: Publish or update pull-request summary
        # The same events that withhold secrets also hand out a read-only token,
        # so commenting would fail on a pull request the analysis itself handled
        # perfectly well. The findings are still in the job summary and the
        # uploaded reports; only the convenience comment is absent.
        if: >-
          always() &&
          steps.review.outputs.comment-file != '' &&
          steps.review.outputs.ingestion-status != 'stale' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]'
        uses: actions/github-script@v8
        env:
          COMMENT_FILE: ${{ steps.review.outputs.comment-file }}
        with:
          script: |
            const fs = require("node:fs");
            const marker = "<!-- system-synthesis-architecture-review -->";
            const body = fs.readFileSync(process.env.COMMENT_FILE, "utf8");
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100
              }
            );
            const existing = comments.find(
              comment =>
                comment.user?.type === "Bot" &&
                comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      - name: Preserve review reports
        if: always() && steps.review.outputs.json-file != ''
        uses: actions/upload-artifact@v7
        with:
          name: architecture-review-${{ github.event.pull_request.number }}
          path: |
            ${{ steps.review.outputs.json-file }}
            ${{ steps.review.outputs.markdown-file }}
            ${{ steps.review.outputs.sarif-file }}
          if-no-files-found: error
          retention-days: 14

      - name: Enforce architecture policy
        if: always()
        shell: bash
        env:
          REVIEW_EXIT_CODE: ${{ steps.review.outputs.exit-code }}
        run: |
          if [[ "$REVIEW_EXIT_CODE" == "0" ]]; then
            exit 0
          fi
          if [[ "$REVIEW_EXIT_CODE" == "1" ]]; then
            echo "Pull request introduces blocking architecture findings."
            exit 1
          fi
          echo "Architecture review could not analyze the supplied inputs."
          exit 2
