version: 2

updates:
  # One npm ecosystem entry covers the workspace root and every workspace, since
  # they share a single lockfile. Weekly rather than daily: this is a small
  # project, and a queue of open update branches nobody reads is worse than a
  # short delay in noticing one that matters.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Patch and minor updates arrive as one branch, so routine upkeep is a
      # single review rather than a dozen. A major sits on its own, because it
      # is a decision rather than upkeep.
      routine:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: Update
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: Update
    labels:
      - dependencies
